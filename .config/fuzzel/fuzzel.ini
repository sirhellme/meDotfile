# ═══════════════════════════════════════════════════════════════════════════
#  fuzzel — launcher
#  Palette lives in themes/noctalia (generated by Noctalia). This file owns
#  font, geometry, padding and border. Include path is relative to the
#  dots-refined tree; the apply command rewrites it to ~/.config/fuzzel.
# ═══════════════════════════════════════════════════════════════════════════

include=/home/h3ll/.config/fuzzel/themes/noctalia

[main]
font=JetBrainsMono Nerd Font:size=11
use-bold=yes
prompt="> "
placeholder=Search
icons-enabled=yes
terminal=kitty -e
width=42
lines=10
horizontal-pad=18
vertical-pad=10
inner-pad=4
line-height=20

# 1px border and 10px corners, matching niri windows and the Noctalia bar.
[border]
width=1
radius=10
selection-radius=6

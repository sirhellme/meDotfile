# ═══════════════════════════════════════════════════════════════════════════
#  kitty — terminal
#  Colors are generated by Noctalia (themes/noctalia.conf); this file only
#  owns behaviour, font and cursor. Do not duplicate generated colors here.
# ═══════════════════════════════════════════════════════════════════════════

include themes/noctalia.conf

shell fish
term xterm-256color

# ── Typography ─────────────────────────────────────────────────────────────
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

# ── Cursor ─────────────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 15

# Neon cursor trail (built-in kitty effect; no custom shader required)
cursor_trail 3
cursor_trail_decay 0.10 0.35
cursor_trail_start_threshold 2

# ── Terminal behaviour ─────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
allow_remote_control socket-only

# ── Scrollback ─────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ── Mouse ──────────────────────────────────────────────────────────────────
mouse_hide_wait 3.0
url_style curly

# ── Performance ────────────────────────────────────────────────────────────
# 16ms ≈ 60fps; sync_to_monitor caps it at the panel refresh rate.
repaint_delay 16
input_delay 1
sync_to_monitor yes
